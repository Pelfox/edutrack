server {
    listen 8080;
    server_name _;

    # Отдача основного файла.
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Поддержка компрессии ответов через gzip.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Кэширование статических файлов сборки.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Отключение кэширования HTML-файлов для обновлений между сборками.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Роутинг через TanStack Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
